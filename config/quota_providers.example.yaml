# 套餐余量监控配置模板。
#
# 使用方法：复制为 config/quota_providers.yaml 并填入真实凭据。
# 该文件包含敏感凭据，已被 .gitignore 忽略，切勿提交到仓库。
#
# 也可改用环境变量注入（优先级高于 YAML）：
#   TOKEN_STAT_ZHIPU_SESSION_TOKEN   → zhipu.session_token
#   TOKEN_STAT_ZHIPU_PLAN_TYPE       → zhipu.plan_type
#   TOKEN_STAT_XIAOMI_COOKIE         → xiaomi.session_token
#   TOKEN_STAT_XIAOMI_PLAN_TYPE      → xiaomi.plan_type
#   TOKEN_STAT_BAILIAN_ACCESS_KEY_ID     → bailian.access_key_id
#   TOKEN_STAT_BAILIAN_ACCESS_KEY_SECRET → bailian.access_key_secret

providers:
  zhipu:
    # 智谱 GLM Coding Plan，session_token 从 bigmodel.cn 登录后的 Cookie 中获取
    enabled: false
    plan_type: pro  # lite / pro / max
    # 套餐制式：auto（默认，按用量接口自动识别）/ credits（新版积分制）/ prompts（历史 V2 制）
    plan_mode: auto
    session_token: "YOUR_ZHIPU_SESSION_TOKEN"

  xiaomi:
    # 小米 MiMo Token Plan，session_token 为完整 Cookie 字符串
    enabled: false
    plan_type: standard
    session_token: "YOUR_XIAOMI_COOKIE"

  bailian:
    # 阿里云百炼 Token Plan（团队版）。AccessKey 由管理员在主账号下创建
    # RAM 只读子用户生成（建议仅授予百炼只读权限），一次配置长期可用。
    enabled: false
    access_key_id: "YOUR_ALIYUN_ACCESS_KEY_ID"
    access_key_secret: "YOUR_ALIYUN_ACCESS_KEY_SECRET"
    # 地域：cn-beijing（默认，国内站）/ ap-southeast-1（国际站）
    region: cn-beijing
