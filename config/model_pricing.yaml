  # ── Xiaomi MiMo — USD / M tokens ──
  # 官方「海外定价 · 实时 API」（mimo.mi.com → 文档 → 定价 → 按量计费，核对于 2026-11-25）。
  mimo-v2.6-pro: &mimo_v26_pro
    input: 0.435
    output: 0.87
    cache_read: 0.0036
  mimo-v2.6-flash: &mimo_v26_flash
    input: 0.14
    output: 0.28
    cache_read: 0.0028
  mimo-v2.6-pro-ultraspeed:
    input: 4.35
    output: 8.7
    cache_read: 0.036
  # MiMo Code 记录的模型名带供应商前缀，与上面是同一个模型
  xiaomi-token-plan-cn/mimo-v2.6-pro: *mimo_v26_pro
  # V2.5 / V2 系列已于 2026-10-21 下线，官方不再公布价格；沿用此前的估算值
  mimo-v2.5-pro: &mimo_v25_pro
    input: 0.8
    output: 3.0
    cache_read: 0.2
  mimo-v2.5: &mimo_v25
    input: 0.4
    output: 1.5
    cache_read: 0.1
  xiaomi/mimo-v2.5-pro: *mimo_v25_pro
  xiaomi/mimo-v2.5: *mimo_v25
  # 估算：按官方 V2.6 的 ultraspeed = pro × 10 比例，以 mimo-v2.5-pro 估算价推得
  xiaomi/mimo-v2.5-pro-ultraspeed:
    input: 8.0
    output: 30.0
    cache_read: 2.0
  mimo-v2-pro:
    input: 0.5
    output: 2.0
    cache_read: 0.125
  mimo-v2-omni:
    input: 0.6
    output: 2.5
    cache_read: 0.15

  # ── 智谱 GLM — USD / M tokens ──
  # z.ai 官方价（docs.z.ai → Guides → Pricing，核对于 2026-11-25）。
  glm-5.3: &glm_flagship
    input: 1.4
    output: 4.4
    cache_read: 0.26
  glm-5.2: *glm_flagship
  glm-5.1: *glm_flagship
  glm-5:
    input: 1.0
    output: 3.2
    cache_read: 0.2
  glm-5.3-flash:
    input: 0.15
    output: 0.5
    cache_read: 0.03
  glm-5.3-flashx:
    input: 0.37
    output: 1.25
    cache_read: 0.075
  glm-4.7: &glm_47
    input: 0.6
    output: 2.2
    cache_read: 0.11
  glm-4.6: *glm_47
  # 官方尚未公布 GLM-5.4 的标准 API 价格（目前只在 GLM Coding Plan 提供）；
  # 暂按同档旗舰 GLM-5.3 的官方价代估，公布后请以官方价为准（可在定价表中修改）。
  glm-5.4: *glm_flagship
  # z.ai 未公布美元价；国内价为 ¥5 / ¥22（输入 <32K）、缓存命中 ¥1.2，沿用估算值
  glm-5-turbo:
    input: 0.3
    output: 1.0
    cache_read: 0.075

